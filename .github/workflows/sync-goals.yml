name: Auto Sync Results & Goals

on:
  schedule:
    # 每天北京时间 8:00 和 12:00 自动运行 (对应 UTC 00:00, 04:00)
    - cron: '0 0,4 * * *'
  # 允许手动触发
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync match results (scores, standings, ICS)
        run: node scripts/sync-results.js --ci

      - name: Sync goal records
        run: node scripts/sync-goals.js --ci

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/worldcup2026-matches.json data/worldcup2026-group_standings.json worldcup2026.ics data/wc2026-goals.json
          if git diff --cached --quiet; then
            echo "No changes, skipping push"
          else
            git commit -m "[auto] sync results & goals from API [skip ci]"
            git push origin gh-pages
          fi
