function getTeamMatches(teamName) {
    const result = [];
    const shortName = teamName.replace(/^\S+\s+/, '');
    for (const [day, dayMatches] of Object.entries(MATCHES)) {
        dayMatches.forEach(m => {
            if (m.m.includes(shortName)) {
                result.push({...m, day});
            }
        });
    }
    return result;
}

function generateICS(matches, teamName) {
    let ics = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//WorldCup26//ZH\r\n';
    let idx = 1;
    for (const m of matches) {
        const [h, min] = m.t.split(':').map(Number);
        const utcH = h - 8;
        const dayNum = parseInt(m.day.replace('月','').replace('日',''));
        const utcDate = new Date(2026, 5, dayNum, utcH, min);
        const iso = utcDate.toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z';
        ics += 'BEGIN:VEVENT\r\n';
        ics += 'UID:wc26-' + idx + '@worldcup26\r\n';
        ics += 'DTSTART:' + iso + '\r\n';
        const endDt = new Date(utcDate.getTime() + 5400000);
        ics += 'DTEND:' + endDt.toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z\r\n';
        ics += 'SUMMARY:' + m.m + '\r\n';
        ics += 'DESCRIPTION:小组赛 ' + m.g + '\n场地: ' + m.s + '\n城市: ' + m.c + '\n' + teamName + '\r\n';
        ics += 'LOCATION:' + m.c + ' - ' + m.s + '\r\n';
        ics += 'END:VEVENT\r\n';
        idx++;
    }
    ics += 'END:VCALENDAR\r\n';
    return ics;
}

function renderCalendar(filteredMatches, teamName) {
    const container = document.getElementById('calendar-app');
    if (filteredMatches && filteredMatches.length === 0) {
        container.innerHTML = '<div class="empty-state"><p>😕 没有找到该球队的比赛</p><p>请尝试其他球队</p></div>';
        return;
    }
    if (teamName === 'all') {
        filteredMatches = null;
    }
    const title = document.getElementById('page-title');
    const totalEl = document.getElementById('total-matches');
    if (teamName === 'all') {
        title.innerHTML = '<small>FIFA WORLD CUP 2026</small>🏆 世界杯观赛日程表';
        totalEl.textContent = '70 场';
    } else {
        const flag = teamName.match(/^\S+/)?.[0] || '🏆';
        title.innerHTML = '<small>FIFA WORLD CUP 2026</small>🏆 ' + flag + ' ' + teamName.replace(/^\S+\s+/, '') + ' 专属赛程';
        const count = filteredMatches ? filteredMatches.length : 0;
        totalEl.textContent = count + ' 场';
    }
    const byDay = {};
    if (!filteredMatches) {
        for (const [day, dayMatches] of Object.entries(MATCHES)) {
            byDay[day] = dayMatches;
        }
    } else {
        filteredMatches.forEach(m => {
            if (!byDay[m.day]) byDay[m.day] = [];
            byDay[m.day].push(m);
        });
    }
    const days = Object.keys(byDay);
    let html = '';
    days.forEach(day => {
        const dayMatches = byDay[day];
        html += '<div class="date-header"><span>📅 ' + day + '</span><span class="day-count">' + dayMatches.length + ' 场</span></div>';
        dayMatches.forEach(m => {
            html += '<div class="match-card">' +
                '<div class="match-time">' + m.t + '</div>' +
                '<div class="match-info">' +
                    '<div class="match-name">' + m.m + '</div>' +
                    '<div class="match-meta">📍 ' + m.c + ' · ' + m.s + '</div>' +
                '</div>' +
                '<span class="group-badge">' + m.g + '</span>' +
            '</div>';
        });
    });
    container.innerHTML = html;
}

function onTeamChange() {
    const sel = document.getElementById('team-select');
    const val = sel.value;
    if (val === 'all-teams') {
        renderCalendar(null, 'all');
    } else if (val && val !== 'select-team') {
        const filtered = getTeamMatches(val);
        renderCalendar(filtered, val);
    }
}

function copyAllSubscribeLink() {
    const url = BASE_URL + 'worldcup2026.ics';
    navigator.clipboard.writeText(url).then(() => {
        alert('✅ 全部赛程订阅链接已复制！\n\n使用方法：\n1. iOS: 设置 → 日历 → 账户 → 添加已订阅的日历 → 粘贴链接\n2. Android/Google: Google Calendar → 设置 → 添加账户 → 从网址添加 → 粘贴链接');
    }).catch(() => {
        prompt('请手动复制以下链接：', url);
    });
}

function copyTeamSubscribeLink() {
    const sel = document.getElementById('team-select');
    const val = sel.value;
    if (val === 'all-teams' || !val || val === 'select-team') {
        copyAllSubscribeLink();
        return;
    }
    const shortName = val.replace(/^\S+\s+/, '');
    const filtered = getTeamMatches(val);
    if (filtered.length === 0) {
        alert('未找到该球队的比赛');
        return;
    }
    const ics = generateICS(filtered, val);
    const blob = new Blob([ics], {type: 'text/calendar'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (shortName.replace(/[\s()]/g,'')) + '_worldcup26.ics';
    a.click();
    URL.revokeObjectURL(url);
    alert('✅ ' + val.replace(/^\S+\s+/, '') + ' 专属赛程已下载！\n\n共 ' + filtered.length + ' 场比赛');
}
