        * { box-sizing: border-box; }
        :root {

            --text-muted: #8888aa;
        }
        body {
            font-family: 'PingFang SC', 'Helvetica Neue', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            background-image: linear-gradient(180deg, #0f0f1a 0%, #1a1a2e 100%);
        }
        .container { max-width: 960px; margin: 0 auto; }
        
        /* ===== Header ===== */
        header { text-align: center; margin-bottom: 24px; }
        h1 {
            color: var(--white);
            margin: 10px 0 5px;
            font-size: 2.2rem;
            letter-spacing: 2px;
        }
        h1 small {
            display: block;
            font-size: 0.45em;
            font-weight: 300;
            color: var(--gold);
            letter-spacing: 4px;
            margin-bottom: 8px;
        }
        .hosts {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin: 12px 0 0;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .hosts span { opacity: 0.6; }
        
        /* ===== Summary Banner ===== */
        .summary-banner {
            background: linear-gradient(135deg, var(--black), #16213e);
            border: 1px solid var(--gold);
            border-radius: 16px;
            padding: 28px 32px;
            margin-bottom: 30px;
            box-shadow: 0 0 30px rgba(200,168,78,0.08), inset 0 0 60px rgba(200,168,78,0.03);
            position: relative;
            overflow: hidden;
        }
        .summary-banner::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--canada-red), var(--usa-blue), var(--mexico-green));
        }
        .summary-banner h2 {
            margin: 0 0 18px;
            font-size: 1.3rem;
            color: var(--gold);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
            margin-bottom: 20px;
        }
        .summary-item {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(200,168,78,0.15);
            border-radius: 12px;
            padding: 14px 18px;
        }
        .summary-item .label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 4px;
            letter-spacing: 1px;
        }
        .summary-item .value {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--white);
        }
        .summary-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: transparent;
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 10px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.95rem;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn:hover {
            background: var(--gold);
            color: var(--black);
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(200,168,78,0.25);
        }
        .btn-outline {
            background: transparent;
            color: var(--text);
            border-color: var(--card-border);
        }
        .btn-outline:hover {
            background: rgba(255,255,255,0.08);
            border-color: var(--text-muted);
        }
        
        /* ===== Date Header ===== */
        .date-header {
            background: linear-gradient(90deg, var(--black), #16213e);
            color: var(--white);
            padding: 10px 20px;
            border-radius: 12px;
            margin: 20px 0 10px;
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--gold);
            border-bottom: 1px solid var(--card-border);
        }
        .date-header .day-count {
            font-size: 0.8rem;
            color: var(--gold);
            background: rgba(200,168,78,0.1);
            padding: 3px 10px;
            border-radius: 10px;
        }
        
        /* ===== Match Card ===== */
        .match-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.2s;
            cursor: pointer;
        }
        .match-card:hover {
            transform: translateY(-2px);
            border-color: var(--gold);
            box-shadow: 0 4px 16px rgba(200,168,78,0.1);
        }
        .match-time {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--gold);
            min-width: 75px;
            text-align: center;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }
        .match-info { flex: 1; }
        .match-name {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--white);
        }
        .match-meta {
            font-size: 0.82rem;
            color: var(--text-muted);
        }
        .group-badge {
            background: rgba(200,168,78,0.12);
            color: var(--gold);
            border: 1px solid rgba(200,168,78,0.25);
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 0.75rem;
            white-space: nowrap;
            font-weight: 600;
        }
        
        /* ===== Footer ===== */
        .footer {
            text-align: center;
            margin-top: 40px;
            font-size: 0.8rem;
            color: var(--text-muted);
            padding: 20px;
            border-top: 1px solid var(--card-border);
        }
        
        /* ===== Responsive ===== */
        @media (max-width: 600px) {
            .match-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
                padding: 14px;
            }

            .match-name { font-size: 1rem; }
            h1 { font-size: 1.5rem; }
            .summary-banner { padding: 20px; }
            .summary-grid { grid-template-columns: 1fr 1fr; }
            .summary-actions { flex-direction: column; }
            .btn { justify-content: center; }
        }
    </style>

            {g:"K组", m:"🇨🇴 哥伦比亚 vs 🇵🇹 葡萄牙", c:"迈阿密", s:"硬石体育场", t:"7:30"}
        ]
    };

    function copySubscribeLink() {
        const url = 'https://glenman.github.io/WorldCup2026-Calendar/worldcup2026.ics';
        navigator.clipboard.writeText(url).then(() => {
            alert('✅ 订阅链接已复制！\n\n使用方法：\n1. iOS: 设置 → 日历 → 账户 → 添加已订阅的日历 → 粘贴链接\n2. Android/Google: Google Calendar → 设置 → 添加账户 → 从网址添加 → 粘贴链接\n3. Outlook: 订阅日历 → 输入粘贴的链接');
        }).catch(() => {
            prompt('请手动复制以下链接：', url);
        });
    }
    
    function renderCalendar() {
        const container = document.getElementById('calendar-app');
        const days = Object.keys(MATCHES);
        let total = 0;
        
        days.forEach(day => {
            const dayCount = MATCHES[day].length;
            total += dayCount;
            
            let html = `<div class="date-header"><span>📅 ${day}</span><span class="day-count">${dayCount} 场</span></div>`;
            
            MATCHES[day].forEach(m => {
                html += `
                    <div class="match-card" onclick="addToCalendar('${m.m}', '${day} ${m.t}')">
                        <div class="match-time">${m.t}</div>
                        <div class="match-info">
                            <div class="match-name">${m.m}</div>
                            <div class="match-meta">📍 ${m.c} · ${m.s}</div>
                        </div>
                        <span class="group-badge">${m.g}</span>
                    </div>`;
            });
            
            container.innerHTML += html;
        });
        
        document.getElementById('total-matches').textContent = total + ' 场';
    }
    
    function addToCalendar(matchName, dateTime) {
        alert(`📅 添加到日历: ${matchName}\n⏰ ${dateTime} (北京时间)`);
    }
    
    renderCalendar();
    </script>
</body>
</html>
