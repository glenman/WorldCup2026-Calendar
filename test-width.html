
<!DOCTYPE html>
<html>
<head>

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { padding: 20px; background: #000; }
        .container { max-width: 960px; margin: 0 auto; width: 100%; }
        .section { background: #222; padding: 20px; margin: 10px 0; border: 1px solid #444; }
        #calendar-app { max-width: 960px; margin: 0 auto; width: 100%; }
        .match-card { background: #333; padding: 16px; margin: 8px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="section">Container 1 (max-width: 960px)</div>
        <div id="calendar-app">
            <div class="match-card">Match 1</div>
            <div class="match-card">Match 2</div>
            <div class="match-card">Match 3</div>
        </div>
    </div>
</body>
</html>
